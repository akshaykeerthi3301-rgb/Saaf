name: Daily ingest (DISABLED — Actions unavailable on this account)

# GitHub Actions is disabled for this account: a workflow_dispatch returns
#   HTTP 422: Actions has been disabled for this user.
# Push and repository access work normally; only Actions are blocked.
#
# The scheduler therefore lives in Vercel Cron — see vercel.json and
# src/app/api/cron/ingest/route.ts. This file is kept, unscheduled, so the
# Actions path is a one-line change if the account restriction is ever lifted:
# restore the `schedule` block below.

on:
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run ingest
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx tsx ingest/run.ts
