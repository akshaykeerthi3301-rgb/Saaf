<!doctype html>
<meta charset="utf-8" />
<!-- Palette restated from src/app/globals.css `.dark` (see content-script.js STYLE). -->
<style>
  :root{--bg:oklch(0.141 0.005 285.823);--card:oklch(0.21 0.006 285.885);--fg:oklch(0.985 0 0);--muted:oklch(0.705 0.015 286.067);
    --line:oklch(1 0 0 / 12%);--brand:oklch(0.585 0.233 277.117);--brand-2:oklch(0.558 0.288 302.321);--accent:oklch(0.673 0.182 276.935)}
  body{width:300px;margin:0;padding:14px;font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--fg);background:var(--bg)}
  h1{font-size:15px;margin:0 0 8px;background:linear-gradient(135deg,var(--accent),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
  p{color:var(--muted);font-size:11px;margin:0 0 8px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;margin-bottom:10px}
  button{width:100%;margin-top:6px;padding:9px 12px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:600;cursor:pointer}
  button.ghost{background:var(--card);border:1px solid var(--line);color:var(--fg)}
  a{color:var(--accent)}
</style>
<h1>Jobinko</h1>
<div class="box" id="acct">Connecting to your Jobinko account…</div>
<div class="box"><b>This page</b><p id="siteMsg" style="margin:4px 0 0"></p><button id="siteAsk" hidden></button></div>
<p>On a supported job or application page, click the Jobinko icon and the panel opens on the right of the page.</p>
<button class="ghost" id="settings">Settings</button>
<script src="extractor.js"></script>
<script src="popup.js"></script>
