<!doctype html>
<meta charset="utf-8" />
<style>
  body{width:300px;margin:0;padding:14px;font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#0f172a}
  h1{font-size:14px;margin:0 0 4px}
  p{color:#64748b;font-size:11px;margin:0 0 10px}
  textarea{width:100%;height:150px;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:8px;padding:8px;font:11px/1.4 inherit;resize:vertical}
  button{margin-top:8px;padding:7px 12px;border:0;border-radius:8px;background:#0f172a;color:#fff;font-weight:600;cursor:pointer}
  .ok{color:#0f766e;font-size:11px;margin-left:8px}
</style>
<h1>Your résumé</h1>
<p>Stored on this machine only, in the browser's own extension storage. It is sent with a scoring request and never written down at the other end.</p>
<textarea id="t" placeholder="Paste your résumé text…"></textarea>
<div><button id="s">Save</button><span class="ok" id="m"></span></div>
<script src="popup.js"></script>
